name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - run: uv pip install --system .

      # edf2asc (EyeLink Developers Kit) is only freely available as a Linux
      # binary here. On Windows/macOS the EyeLink tests are skipped at runtime
      # via shutil.which("edf2asc"), so the other formats still exercise those
      # platforms.
      - name: Install edf2asc (Linux only)
        if: runner.os == 'Linux'
        run: |
          curl -L -o /usr/local/bin/edf2asc https://github.com/ihrke/pypillometry/raw/refs/heads/master/external/edf2asc-linux
          chmod +x /usr/local/bin/edf2asc

      - run: uv pip install --system pytest

      - run: pytest -vv -ra

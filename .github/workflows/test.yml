name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; macos-15-intel retains x86_64 coverage.
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked --extra dev

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install the official BIDS Validator
        run: deno install -ERWN -g -n bids-validator jsr:@bids/validator@3.0.1

      # EDF conversion is not exercised by the committed ASC fixture. Keep the
      # helper available on Linux without attempting to run a Linux binary on
      # Windows or macOS.
      - name: Install edf2asc (Linux only)
        if: runner.os == 'Linux'
        run: |
          curl -L -o /usr/local/bin/edf2asc https://github.com/ihrke/pypillometry/raw/refs/heads/master/external/edf2asc-linux
          chmod +x /usr/local/bin/edf2asc

      - run: uv run --locked pytest -vv -ra

name: ci-docs


on:
  push:
    branches:
      - main
      - reviewer-changes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up git credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v6

      # The tutorials are executed during the build, so the optional features
      # they exercise have to be installed alongside the documentation tools.
      - name: Install the package with its docs and feature extras
        run: uv sync --locked --extra docs --extra all

      # A build failure here means a tutorial stopped working, which is the
      # point: they are executed on every push rather than trusted.
      - name: Build the documentation
        run: uv run --locked mkdocs build --strict

      # gh-pages holds a single site, so whichever branch deploys last is what
      # the world sees. reviewer-changes is allowed to deploy while the JOSS
      # review is open, so reviewers read the current docs rather than the
      # revision they commented on. Drop it from this list once it merges.
      - name: Deploy
        if: >-
          matrix.os == 'ubuntu-latest' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/reviewer-changes')
        run: uv run --locked mkdocs gh-deploy --force

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyxations"
version = "0.3.0"
description = "Pyxations: a Python-based toolbox to organize, parse, and analyse eye-movement data"
authors = [{name = "NeuroLIAA"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "matplotlib>=3.9.2",
    "numpy>=1.24",
    "polars>=1.26.0",
]

[project.optional-dependencies]
remodnav = [
    "remodnav>=1.1.2",
]
multimatch = [
    "multimatch-gaze>=0.1.3",
]
video = [
    "opencv-python>=4.9.0.80",
]
all = [
    "multimatch-gaze>=0.1.3",
    "opencv-python>=4.9.0.80",
    "remodnav>=1.1.2",
]
dev = [
    "black",
    "multimatch-gaze>=0.1.3",
    "opencv-python>=4.9.0.80",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "remodnav>=1.1.2",
    "ruff",
]
docs = [
    "mkdocs",
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocstrings[python]",
    "multimatch-gaze>=0.1.3",
    "opencv-python>=4.9.0.80",
    "remodnav>=1.1.2",
]

[project.urls]
Homepage = "https://github.com/NeuroLIAA/pyxations"

[tool.hatch.build.targets.sdist]
include = ["pyxations"]

[tool.coverage.run]
relative_files = true
source = ["pyxations"]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_covered = true

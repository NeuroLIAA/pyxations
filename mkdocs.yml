site_name: Pyxations Documentation
site_url: https://neuroliaa.github.io/pyxations/
repo_url: https://github.com/NeuroLIAA/pyxations

theme:
  name: material
  logo: images/pyxations_improved_logo.png
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
  features:
    - navigation.sections
    - search.highlight
    - search.share

# driving_animation needs an eye-tracking dataset that is not committed, so it
# cannot be executed at build time. Excluded rather than listed, since every
# notebook under docs/ is executed whether or not it appears in the nav.
exclude_docs: |
  tutorials/driving_animation.ipynb

nav:
  - Home: index.md
  - Requirements: requirements.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Usage: usage.md
  - Concepts: concepts.md
  - Tutorials:
      - EyeLink: tutorials/eyelink_example.ipynb
      - Tobii: tutorials/tobii_example.ipynb
      - GazePoint: tutorials/gazepoint_example.ipynb
      - Webcam (WebGazer): tutorials/webgazer_example.ipynb
      - MultiMatch scanpath comparison: tutorials/multimatch_example.ipynb
  - API reference:
      - Overview: api/index.md
      - Conversion to BIDS: api/conversion.md
      - Preprocessing: api/preprocessing.md
      - Event detection: api/detection.md
      - Analysis: api/analysis.md
      - Visual search: api/visual_search.md
      - Visualization: api/visualization.md
      - Data storage: api/storage.md
  - Contributing: contributing.md
  - License: license.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NeuroLIAA/pyxations

plugins:
  - mkdocs-jupyter:
      execute: true
      allow_errors: false
      include_source: true
      remove_tag_config:
        remove_input_tags:
          - hide_code
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy

  - search

copyright: Copyright &copy; 2026 Laboratorio de Inteligencia Artificial Aplicada (ICC-UBA-CONICET)
